server {
    listen 80;
    server_name quickref.securionis.com;

    # Cloudflare mode Flexible : Cloudflare → VPS en HTTP, Cloudflare → visiteur en HTTPS.
    # Pas de certificat SSL nécessaire sur le VPS.

    root  /var/www/quickref.securionis.com;
    index index.html;

    # SPA routing : toutes les routes servent index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets statiques
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Headers de sécurité
    add_header X-Frame-Options              "DENY"                                always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
